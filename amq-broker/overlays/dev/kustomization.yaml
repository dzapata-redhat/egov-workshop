apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

namespace: amq-dev

patches:
  - target:
      kind: Namespace
      name: amq
    patch: |-
      - op: replace
        path: /metadata/name
        value: amq-dev
      - op: replace
        path: /metadata/labels/kubernetes.io~1metadata.name
        value: amq-dev
      - op: replace
        path: /metadata/annotations/openshift.io~1description
        value: amq-dev
      - op: replace
        path: /metadata/annotations/openshift.io~1display-name
        value: AMQ-DEV
      - op: replace
        path: /metadata/annotations/openshift.io~1node-selector
        value: middle=dev
      - op: replace
        path: /metadata/annotations/scheduler.alpha.kubernetes.io~1defaultTolerations
        value: '[{"value": "reserved", "effect": "NoSchedule", "key": "middleware-dev"}]'

      - op: add
        path: /metadata/labels/dynakube.internal.dynatrace.com~1instance
        value: arodevqa
      - op: add
        path: /metadata/labels/dynatrace.com~1injected
        value: "true"
  - target:
      kind: OperatorGroup
      name: amq
    patch: |-
      - op: replace
        path: /metadata/name
        value: amq-dev
      - op: replace
        path: /spec/targetNamespaces
        value: ["amq-dev"]
  - target:
      kind: Subscription
      name: amq-broker-rhel9
    patch: |-
      - op: add
        path: /spec/startingCSV
        value: amq-broker-operator.v7.13.1-opr-1-0.1758027574.p
  - target:
      kind: ActiveMQArtemis
      name: broker-persistent
    patch: |-
      - op: replace
        path: /metadata/name
        value: broker-dev-persistent
      - op: replace
        path: /spec/deploymentPlan/jolokiaAgentEnabled
        value: true
      - op: replace
        path: /spec/deploymentPlan/storage/storageClassName
        value: managed-csi

      - op: add
        path: /spec/brokerProperties/-
        value: jmxManagementEnabled=true
  - target:
      kind: ActiveMQArtemis
      name: broker
    patch: |-
      - op: replace
        path: /metadata/name
        value: broker-dev
      - op: replace
        path: /spec/deploymentPlan/size
        value: 1
  - target:
      kind: ActiveMQArtemisScaledown
      name: broker-persistent
    patch: |-
      - op: replace
        path: /metadata/name
        value: broker-dev-persistent
      - op: replace
        path: /metadata/annotations
        value: 
          argocd.argoproj.io/sync-wave: "5"
          SERVICE_ACCOUNT: amq-broker-controller-manager
          CLUSTERUSER: vHwBW39P
          SERVICE_ACCOUNT_NAME: amq-broker-controller-manager
          CLUSTERPASS: z00fPful
          CRNAMESPACE: amq-dev
          PINGSVCNAMEVALUE: broker-dev-persistent-ping-svc
          CRNAME: broker-dev-persistent
          AMQ_CREDENTIALS_SECRET_NAME: broker-dev-persistent-credentials-secret
          HEADLESSSVCNAMEVALUE: broker-dev-persistent-hdls-svc
      - op: replace
        path: /metadata/labels/ActiveMQArtemis
        value: broker-dev-persistent
      - op: replace
        path: /metadata/labels/application
        value: broker-dev-persistent-app
